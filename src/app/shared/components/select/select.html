<mat-form-field appearance="outline">
  <mat-label>{{ label }}</mat-label>

  @if (control) {
    <mat-select
      [formControl]="control"
      [panelClass]="panelClass"
      (selectionChange)="selectOption($event.value)"
      [compareWith]="compareFn"
    >
      @for (option of options; track option.value) {
        <mat-option [value]="option.value">
          {{ option.label }}
        </mat-option>
      }
    </mat-select>
  } @else {
    <mat-select
      [value]="selectedValue"
      [disabled]="disabled"
      [panelClass]="panelClass"
      (selectionChange)="selectOption($event.value)"
      [compareWith]="compareFn"
    >
      @for (option of options; track option.value) {
        <mat-option [value]="option.value">
          {{ option.label }}
        </mat-option>
      }
    </mat-select>
  }

  @if (errorMessage) {
    <mat-error>
      {{ errorMessage }}
    </mat-error>
  }
</mat-form-field>
