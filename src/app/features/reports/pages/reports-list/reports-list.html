<app-container-page-layout>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Relatórios</mat-card-title>
    </mat-card-header>

    <mat-card-content class="reports-list">
      <button type="button" class="report-option" (click)="openCommissionBySeller()">
        <mat-icon aria-hidden="true">bar_chart</mat-icon>
        <span>Comissão por vendedor</span>
        <mat-icon class="report-option__arrow" aria-hidden="true">chevron_right</mat-icon>
      </button>
    </mat-card-content>
  </mat-card>
</app-container-page-layout>
